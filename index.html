<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap"

    />

    <link rel="modulepreload" crossorigin href="/goit-advancedjs-hw-03/assets/vendor-B4VkUtbg.js">
    <link rel="stylesheet" crossorigin href="/goit-advancedjs-hw-03/assets/vendor-DumFYO8Z.css">

  <body>
    <main class="container">
      <form class="form">
        <label>
          <input
            class="search-input"
            type="text"
            name="search-text"
            placeholder="Search images..."
            autocomplete="off"
            required
          />
        </label>
        <button class="search-btn" type="submit">Search</button>
      </form>

      <div class="loader-container is-hidden">
        <span class="loader"></span>
        <p class="loader-text">Loading images, please wait...</p>
      </div>

      <ul class="gallery"></ul>
    </main>
